[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "trialfair"
version = "0.1.0"
description = "Evidence-backed investigation of sex-specific clinical trial safety gaps"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "streamlit>=1.40,<2",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "google-genai>=1,<3",
  "pandas>=2.2,<4",
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: opt-in paid/network test; never run by default"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
